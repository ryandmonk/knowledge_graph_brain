name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [orchestrator, mcp-server, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd ${{ matrix.package }} && npm ci
      - run: cd ${{ matrix.package }} && npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd orchestrator && npm ci
      - run: cd orchestrator && npm test
